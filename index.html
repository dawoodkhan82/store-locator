        function filterStores() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            // Get selected states from location filter (now organized by regions)
            const selectedStates = Array.from(document.querySelectorAll('#locationCheckboxes input[data-type="state"]:checked'))
                .map(cb => cb.value);

            // Get selected brands (only brand checkboxes, not category checkboxes)
            const selectedBrands = Array.from(document.querySelectorAll('#brandCheckboxes input[data-type="brand"]:checked'))
                .map(cb => cb.value);

            // Get selected social filters
            const selectedSocial = Array.from(document.querySelectorAll('#socialFilterDropdown input:checked'))
                .map(cb => cb.value);

            // Get selected size filter
            const selectedSize = document.querySelector('#sizeFilterDropdown input[name="sizeFilter"]:checked')?.value || 'all';

            filteredStores = GROUPED_STORES.filter(store => {
                const name = (store.displayName?.text || store.name || '').toLowerCase();
                const address = getStoreAddress(store);
                const storeState = store.state_code || extractState(store, address);

                const enrichment = store.enrichment || {};
                const categories = (enrichment.productCategories || []).join(' ').toLowerCase();
                const specialties = (enrichment.specialties || []).join(' ').toLowerCase();
                const socialLinks = enrichment.socialLinks || {};

                // Text search filter
                const matchesSearch = !searchTerm ||
                    name.includes(searchTerm) ||
                    address.toLowerCase().includes(searchTerm) ||
                    categories.includes(searchTerm) ||
                    specialties.includes(searchTerm);

                // Location filter: match selected states (check any location for grouped stores)
                let matchesLocation = true;
                if (selectedStates.length > 0) {
                    const locations = store.locations || [store];
                    matchesLocation = locations.some(loc => {
                        const locAddress = getStoreAddress(loc);
                        const locState = loc.state_code || loc.state || extractState(loc, locAddress);
                        return selectedStates.includes(locState);
                    });
                }

                // Brand filter (OR logic - match ANY selected brand)
                let matchesBrand = true;
                if (selectedBrands.length > 0) {
                    const storeBrands = store.brands || [store.brand, store.source].filter(Boolean);
                    matchesBrand = selectedBrands.some(selectedBrand =>
                        storeBrands.includes(selectedBrand)
                    );
                }

                // Social filter (OR logic - match ANY selected social)
                let matchesSocial = true;
                if (selectedSocial.length > 0) {
                    matchesSocial = selectedSocial.some(social => {
                        if (social === 'instagram') return !!socialLinks.instagram;
                        if (social === 'facebook') return !!socialLinks.facebook;
                        if (social === 'twitter') return !!socialLinks.twitter;
                        return false;
                    });
                }

                // Size filter (number of locations)
                let matchesSize = true;
                const locationCount = store.locationCount || 1;
                if (selectedSize === 'single') {
                    matchesSize = locationCount === 1;
                } else if (selectedSize === 'min5') {
                    matchesSize = locationCount >= 5;
                } else if (selectedSize === 'min10') {
                    matchesSize = locationCount >= 10;
                }

                return matchesSearch && matchesLocation && matchesBrand && matchesSocial && matchesSize;
            });

            // Update button labels
            updateFilterLabels(selectedBrands, selectedSocial, selectedStates, selectedSize);

            // Update active filter tags
            updateActiveFilterTags(selectedBrands, selectedSocial, selectedStates, selectedSize);

            // Update filtered results count
            updateFilteredResultsCount(searchTerm, selectedStates, selectedBrands, selectedSocial, selectedSize);

            currentPage = 1; // Reset to first page when filtering
            sortStores();
        }

        function updateFilteredResultsCount(searchTerm, selectedStates, selectedBrands, selectedSocial, selectedSize) {
            const countEl = document.getElementById('filteredResultsCount');
            const hasFilters = searchTerm || selectedStates.length > 0 ||
                              selectedBrands.length > 0 || selectedSocial.length > 0 ||
                              (selectedSize && selectedSize !== 'all');

            if (hasFilters) {
                countEl.textContent = `${filteredStores.length.toLocaleString()} of ${GROUPED_STORES.length.toLocaleString()} stores`;
                countEl.style.display = 'inline';
            } else {
                countEl.textContent = '';
                countEl.style.display = 'none';
            }
        }

        function updateFilterLabels(selectedBrands, selectedSocial, selectedStates, selectedSize) {
            const brandLabel = document.getElementById('brandFilterLabel');
            const socialLabel = document.getElementById('socialFilterLabel');
            const locationLabel = document.getElementById('locationFilterLabel');
            const sizeLabel = document.getElementById('sizeFilterLabel');

            // Update location label (now counts states only)
            if (selectedStates.length > 0) {
                locationLabel.textContent = `Region (${selectedStates.length})`;
                locationLabel.style.fontWeight = '600';
            } else {
                locationLabel.textContent = 'Region';
                locationLabel.style.fontWeight = 'normal';
            }

            // Update brand label
            if (selectedBrands.length > 0) {
                brandLabel.textContent = `Brands (${selectedBrands.length})`;
                brandLabel.style.fontWeight = '600';
            } else {
                brandLabel.textContent = 'Brands';
                brandLabel.style.fontWeight = 'normal';
            }

            // Update social label
            if (selectedSocial.length > 0) {
                socialLabel.textContent = `Social (${selectedSocial.length})`;
                socialLabel.style.fontWeight = '600';
            } else {
                socialLabel.textContent = 'Social Media';
                socialLabel.style.fontWeight = 'normal';
            }

            // Update size label
            const sizeLabels = {
                'all': 'Store Size',
                'single': '1 Location',
                'min5': '≥5 Locations',
                'min10': '≥10 Locations'
            };
            if (selectedSize && selectedSize !== 'all') {
                sizeLabel.textContent = sizeLabels[selectedSize] || 'Store Size';
                sizeLabel.style.fontWeight = '600';
            } else {
                sizeLabel.textContent = 'Store Size';
                sizeLabel.style.fontWeight = 'normal';
            }
        }

        function updateActiveFilterTags(selectedBrands, selectedSocial, selectedStates, selectedSize) {
            const container = document.getElementById('activeFiltersContainer');
            const tagsDiv = document.getElementById('activeFilterTags');
            tagsDiv.innerHTML = '';

            const hasFilters = selectedBrands.length > 0 || selectedSocial.length > 0 || selectedStates.length > 0 ||
                              (selectedSize && selectedSize !== 'all');

            if (!hasFilters) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';

            // Add state tags
            selectedStates.forEach(state => {
                const tag = createFilterTag(state, () => {
                    const checkbox = document.querySelector(`#locationCheckboxes input[data-type="state"][value="${state}"]`);
                    if (checkbox) checkbox.checked = false;
                    filterStores();
                });
                tagsDiv.appendChild(tag);
            });

            // Add brand tags
            selectedBrands.forEach(brand => {
                const tag = createFilterTag(brand.replace(/_/g, ' '), () => {
                    const checkbox = document.querySelector(`#brandCheckboxes input[value="${brand}"]`);
                    if (checkbox) {
                        checkbox.checked = false;
                        const category = checkbox.dataset.category;
                        if (category) updateCategoryCheckbox(category);
                    }
                    filterStores();
                });
                tagsDiv.appendChild(tag);
            });

            // Add social tags
            selectedSocial.forEach(social => {
                const label = social.charAt(0).toUpperCase() + social.slice(1);
                const tag = createFilterTag(label, () => {
                    const checkbox = document.querySelector(`#socialFilterDropdown input[value="${social}"]`);
                    if (checkbox) checkbox.checked = false;
                    filterStores();
                });
                tagsDiv.appendChild(tag);
            });

            // Add size tag
            if (selectedSize && selectedSize !== 'all') {
                const sizeLabels = {
                    'single': '1 Location',
                    'min5': '≥5 Locations',
                    'min10': '≥10 Locations'
                };
                const tag = createFilterTag(sizeLabels[selectedSize], () => {
                    const allRadio = document.querySelector('#sizeFilterDropdown input[value="all"]');
                    if (allRadio) allRadio.checked = true;
                    filterStores();
                });
                tagsDiv.appendChild(tag);
            }
        }

        function createFilterTag(text, onRemove) {
            const tag = document.createElement('div');
            tag.style.cssText = 'display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; background-color: rgba(46, 170, 220, 0.15); color: rgb(24, 51, 71); border-radius: 3px; font-size: 13px;';

            const textSpan = document.createElement('span');
            textSpan.textContent = text;

            const removeBtn = document.createElement('button');
            removeBtn.textContent = '×';
            removeBtn.style.cssText = 'background: none; border: none; color: rgb(24, 51, 71); font-size: 16px; cursor: pointer; padding: 0; line-height: 1; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;';
            removeBtn.onclick = onRemove;

            tag.appendChild(textSpan);
            tag.appendChild(removeBtn);

            return tag;
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';

            // Uncheck all location (state and region) checkboxes
            document.querySelectorAll('#locationCheckboxes input[data-type="state"]').forEach(cb => cb.checked = false);
            document.querySelectorAll('#locationCheckboxes input[data-type="region"]').forEach(cb => {
                cb.checked = false;
                cb.indeterminate = false;
            });

            // Collapse all regions
            document.querySelectorAll('.region-states-container').forEach(container => {
                container.style.display = 'none';
                const btn = container.previousElementSibling?.querySelector('.region-expand-btn');
                if (btn) btn.textContent = '▶';
            });

            // Uncheck all brand checkboxes and reset category states
            document.querySelectorAll('#brandCheckboxes input').forEach(cb => {
                cb.checked = false;
                cb.indeterminate = false;
            });

            // Collapse all brand categories
            document.querySelectorAll('.category-brands-container').forEach(container => {
                container.style.display = 'none';
                const btn = container.previousElementSibling?.querySelector('.category-expand-btn');
                if (btn) btn.textContent = '▶';
            });

            // Uncheck all social checkboxes
            document.querySelectorAll('#socialFilterDropdown input').forEach(cb => cb.checked = false);

            // Reset size filter to 'all'
            const allSizeRadio = document.querySelector('#sizeFilterDropdown input[value="all"]');
            if (allSizeRadio) allSizeRadio.checked = true;

            filterStores();
        }

        function sortStores() {
            const sortBy = document.getElementById('sortBy').value;

            filteredStores.sort((a, b) => {
                if (sortBy === 'name') {
                    const nameA = a.displayName?.text || a.name || '';
                    const nameB = b.displayName?.text || b.name || '';
                    return nameA.localeCompare(nameB);
                } else if (sortBy === 'address') {
                    const addressA = a.formattedAddress || a.address_line_1 || '';
                    const addressB = b.formattedAddress || b.address_line_1 || '';
                    return addressA.localeCompare(addressB);
                }
                return 0;
            });

            renderStores(filteredStores);
        }

        function exportFilteredStoresToCSV() {
            if (filteredStores.length === 0) {
                alert('No stores to export after applying filters.');
                return;
            }

            // CSV headers
            const headers = [
                'Store Name',
                'Address',
                'City',
                'State',
                'ZIP Code',
                'Brands',
                'Categories',
                'Specialties',
                'Website',
                'Phone',
                'Instagram',
                'Facebook',
                'Twitter',
                'Data Sources',
                'Latitude',
                'Longitude'
            ];

            // Convert stores to CSV rows
            const csvRows = filteredStores.map(store => {
                const enrichment = store.enrichment || {};
                const socialLinks = enrichment.socialLinks || {};

                // Extract address components
                const address = getStoreAddress(store);
                const city = store.city || '';
                const state = store.state_code || extractState(store, address) || '';
                const zip = store.zip_code || extractZipCode(store, address) || '';

                // Extract brands (from locations if available)
                const brands = store.brands || (store.locations && store.locations.length > 0 ?
                    [...new Set(store.locations.map(loc => loc.brand || loc.source || '').filter(b => b))] :
                    [store.brand || store.source || '']).filter(b => b).join('; ') || '';

                // Extract categories and specialties
                const categories = (enrichment.productCategories || []).join('; ');
                const specialties = (enrichment.specialties || []).join('; ');

                // Extract website and phone
                const website = store.website || enrichment.website || '';
                const phone = store.phone || enrichment.phone || '';

                // Extract social media links
                const instagram = socialLinks.instagram || '';
                const facebook = socialLinks.facebook || '';
                const twitter = socialLinks.twitter || '';

                // Data sources
                const dataSources = (store.dataEnriched || []).join('; ');

                // Coordinates
                const lat = store.lat || (store.locations && store.locations[0] && store.locations[0].lat) || '';
                const lng = store.lng || (store.locations && store.locations[0] && store.locations[0].lng) || '';

                return [
                    store.displayName?.text || store.name || 'Unknown',
                    address,
                    city,
                    state,
                    zip,
                    brands,
                    categories,
                    specialties,
                    website,
                    phone,
                    instagram,
                    facebook,
                    twitter,
                    dataSources,
                    lat,
                    lng
                ];
            });

            // Combine headers and rows
            const csvContent = [headers, ...csvRows]
                .map(row => row.map(cell => `"${String(cell || '').replace(/"/g, '""')}"`).join(','))
                .join('\\n');

            // Create and download the file
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `filtered_stores_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
