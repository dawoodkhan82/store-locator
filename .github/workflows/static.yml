# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate supabase-config.js
        run: |
          cat > supabase-config.js << 'SCRIPT'
          const SUPABASE_URL = "${{ secrets.SUPABASE_URL }}";
          const SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}";
          const INSTAGRAM_APP_ID = "${{ secrets.INSTAGRAM_APP_ID }}";
          const EDGE_FUNCTIONS_URL = "${{ secrets.SUPABASE_URL }}/functions/v1";
          window.SUPABASE_URL = SUPABASE_URL;
          window.SUPABASE_ANON_KEY = SUPABASE_ANON_KEY;
          window.INSTAGRAM_APP_ID = INSTAGRAM_APP_ID;
          window.EDGE_FUNCTIONS_URL = EDGE_FUNCTIONS_URL;
          SCRIPT
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
